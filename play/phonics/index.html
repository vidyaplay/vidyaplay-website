<!DOCTYPE html>
<html lang="en">
<head>

  <title>Phonics Lesson 1: The s Sound with Sunny | VidyaPlay</title>
  <meta name="description" content="Free interactive phonics lesson for Nursery and LKG: Sunny the Sun teaches the s sound with pictures, a listening game and letter tracing.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../../favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css?v=5">
  <style>
    body { background: linear-gradient(#BFE3FA 0%, #E3F4FF 55%, #FFF6DD 100%); background-attachment: fixed; min-height: 100vh; }
    body::after { content: ""; position: fixed; left: -10%; right: -10%; bottom: -60px; height: 160px; z-index: -1;
      background: radial-gradient(ellipse at 30% 0%, #8FD16A 0 60%, transparent 61%), radial-gradient(ellipse at 80% 10%, #6CC24A 0 55%, transparent 56%); }
    .ph-wrap { max-width: 560px; margin: 0 auto; padding: 10px 16px 40px; font-family: "Baloo 2", system-ui, sans-serif; color: var(--navy); }
    .ph-map { display: flex; gap: 8px; justify-content: center; margin: 8px 0 12px; flex-wrap: wrap; }

    .ph-tile.open { background: linear-gradient(#9B6BE0, #7B4CC9); color: #fff; border: 3px solid #fff; box-shadow: 0 4px 0 #5B33A0, 0 6px 14px rgba(123,76,201,.35); }
    .ph-tile.done::after { content: "★"; position: absolute; top: -12px; right: -9px; font-size: 22px; color: #FFC107; text-shadow: 0 0 2px #B07800; }
    .ph-steps { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
    .ph-steps span { width: 38px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.8); box-shadow: inset 0 0 0 2px #D6DEEC; }
    .ph-steps span.on:nth-child(1) { background: #E8456B; box-shadow: none; } .ph-steps span.on:nth-child(2) { background: #F39A1E; box-shadow: none; }
    .ph-steps span.on:nth-child(3) { background: #F5C518; box-shadow: none; } .ph-steps span.on:nth-child(4) { background: #2E9E4F; box-shadow: none; }
    .ph-steps span.on:nth-child(5) { background: #1E5BB8; box-shadow: none; } .ph-steps span.on:nth-child(6) { background: #7B4CC9; box-shadow: none; }
    .ph-card { position: relative; overflow: hidden; background: #fff; border-radius: 30px; padding: 26px 16px 22px; text-align: center; min-height: 460px;
      box-shadow: 0 10px 30px rgba(19,35,74,.14); border: 4px solid #fff; }
    .ph-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10px;
      background: linear-gradient(90deg, #E8456B 0 16.6%, #F39A1E 0 33.3%, #F5C518 0 50%, #2E9E4F 0 66.6%, #1E5BB8 0 83.3%, #7B4CC9 0); }
    .ph-card h1 { font-size: 28px; margin: 4px 0 6px; line-height: 1.15; color: var(--navy); }
    .ph-card p { font-size: 19px; margin: 6px 0; color: var(--text); }
    .ph-card p b { color: #E8456B; }
    .ph-big { font-size: 130px; font-weight: 800; line-height: 1; color: #7B4CC9; margin: 0 0 4px; text-shadow: 4px 5px 0 #F5C518; }
    .ph-btn { display: inline-block; border: 0; border-radius: 22px; padding: 12px 26px; margin: 8px 4px; font: 800 22px "Baloo 2", sans-serif;
      background: #2E9E4F; color: #fff; cursor: pointer; min-height: 56px; box-shadow: 0 5px 0 #1F7438; transition: transform .1s, box-shadow .1s; }
    .ph-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #1F7438; }
    .ph-btn.alt { background: #F39A1E; box-shadow: 0 5px 0 #C0730B; }
    .ph-btn.alt:active { box-shadow: 0 1px 0 #C0730B; }
    .ph-btn[disabled] { opacity: .45; cursor: default; transform: none; }
    .ph-choice { aspect-ratio: 1; border: 4px solid transparent; border-radius: 24px; padding: 10px; cursor: pointer; transition: transform .15s;
      box-shadow: 0 5px 0 rgba(19,35,74,.12); }
    .ph-grid .ph-choice:nth-child(4n+1) { background: #FFF1C2; } .ph-grid .ph-choice:nth-child(4n+2) { background: #FFE0E8; }
    .ph-grid .ph-choice:nth-child(4n+3) { background: #DDF1FF; } .ph-grid .ph-choice:nth-child(4n+4) { background: #E2F6DC; }
    .ph-choice:active { transform: scale(.95); }
    .ph-choice img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    .ph-choice.right { border-color: #2E9E4F; }
    .ph-choice.wrong { border-color: #E8456B; animation: shake .35s; }
    .ph-choice.used { opacity: .35; pointer-events: none; }
    @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .ph-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 340px; margin: 10px auto; }
    .ph-msg { min-height: 56px; font-size: 20px; font-weight: 800; margin: 6px 0; border-radius: 16px; padding: 4px 8px; }
    .ph-msg.good { color: #1F7438; background: #E2F6DC; } .ph-msg.bad { color: #C2264B; background: #FFE0E8; }
    #trace { width: 280px; height: 300px; touch-action: none; background: #FFF9E6; border-radius: 24px; border: 4px dashed #F5C518; }
    .ph-stars { font-size: 60px; color: #FFC107; letter-spacing: 8px; text-shadow: 0 3px 0 #C98F00; animation: pop .6s ease-out; }
    @keyframes pop { 0% { transform: scale(.2); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
    .ph-note { font-size: 15px; color: #5A6580; margin-top: 16px; text-align: left; background: rgba(255,255,255,.85); border-radius: 18px; padding: 10px 14px; border-left: 6px solid #F39A1E; }
    .ph-sunny { width: 150px; height: 150px; margin: 10px 0 30px; object-fit: contain; transition: transform .5s, filter .5s;
      filter: drop-shadow(0 0 10px rgba(255,193,7,.45)); animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 0%,100% { translate: 0 0; } 50% { translate: 0 -8px; } }
    .ph-fly { position: fixed; z-index: 9; pointer-events: none; transition: transform .6s ease-in, opacity .6s; }
    .ph-letters { display: flex; gap: 14px; justify-content: center; margin: 16px 0; }
    .ph-letter { width: 94px; height: 94px; border-radius: 26px; border: 4px solid transparent; font: 800 60px "Baloo 2", sans-serif; color: #fff; cursor: pointer; }
    .ph-letter:nth-child(1) { background: #1E5BB8; box-shadow: 0 6px 0 #133E80; } .ph-letter:nth-child(2) { background: #E8456B; box-shadow: 0 6px 0 #A82646; }
    .ph-letter:nth-child(3) { background: #2E9E4F; box-shadow: 0 6px 0 #1F7438; }
    .ph-letter.right { border-color: #F5C518; transform: scale(1.12); } .ph-letter.wrong { opacity: .45; animation: shake .35s; }
    .ph-slide { display: inline-block; font-size: 84px; margin: 10px 0; animation: slide 1.6s ease-in-out infinite; }
    @keyframes slide { 0%,100% { transform: translateX(-40px) rotate(-8deg); } 50% { transform: translateX(40px) rotate(8deg); } }
    .ph-link { display: inline-block; margin: 10px 0 2px; font-size: 18px; font-weight: 800; color: #fff; background: #7B4CC9; padding: 8px 18px; border-radius: 18px; text-decoration: none; }
    .ph-cap { font-size: 16px; color: #66708A; min-height: 24px; }
    .ph-confetti { position: fixed; top: -20px; width: 10px; height: 16px; border-radius: 3px; z-index: 20; pointer-events: none; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
    @media (prefers-reduced-motion: reduce) { .ph-sunny, .ph-slide, .ph-stars { animation: none; } .ph-confetti { display: none; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="topbar-logo" href="../../" aria-label="VidyaPlay home">
      <span class="blue">Vidya</span><span class="pink">P</span><span class="orange">l</span><span class="green">a</span><span class="purple">y</span>
    </a>
  </header>

  <main class="ph-wrap">
    <div class="ph-map" id="map" aria-label="Phonics lessons"></div>
    <div class="ph-steps" id="steps" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <section class="ph-card" id="card" aria-live="polite"></section>
    <p class="ph-note"><b>For parents:</b> Sit with your child. Say the sound "sss" (a long hiss, not "suh"). Progress is saved only on this device, nothing is sent to us. No sign-up needed.</p>
  </main>

<script>
(function () {
  var LESSONS = ["s", "a", "t", "i", "p", "n"];
  var KEY = "vp_phonics_v1";
  var prog = { done: {} };
  try { var raw = localStorage.getItem(KEY); if (raw) prog = JSON.parse(raw) || prog; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {} }
  function drawMap() {
    var m = document.getElementById("map"); m.innerHTML = "";
    LESSONS.forEach(function (l, i) {
      var t = document.createElement("div");
      t.className = "ph-tile" + (i === 0 ? " open" : "") + (prog.done[l] ? " done" : "");
      t.textContent = l; t.title = i === 0 ? "Lesson 1" : "Coming soon";
      m.appendChild(t);
    });
  }
  // ---- sound: her recorded clips (audio/NAME.mp3); the "sss" also has a browser fallback ----
  var ctx = null;
  function hiss() {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      var d = 0.9, n = Math.floor(ctx.sampleRate * d), buf = ctx.createBuffer(1, n, ctx.sampleRate), ch = buf.getChannelData(0);
      for (var i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
      var src = ctx.createBufferSource(); src.buffer = buf;
      var hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 3800;
      var bp = ctx.createBiquadFilter(); bp.type = "peaking"; bp.frequency.value = 6500; bp.Q.value = 1.2; bp.gain.value = 8;
      var g = ctx.createGain(), t0 = ctx.currentTime;
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.35, t0 + 0.08);
      g.gain.setValueAtTime(0.35, t0 + d - 0.15); g.gain.linearRampToValueAtTime(0, t0 + d);
      src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(ctx.destination); src.start();
    } catch (e) {}
  }
  var cache = {}, current = null, haveVoice = {};
  function stopVoice() { if (current) { try { current.pause(); } catch (e) {} current.onended = null; current = null; } }
  function say(name, then) {                    // plays audio/name.mp3 if it exists; if not, carries on silently
    stopVoice();
    var a = cache[name] || (cache[name] = new Audio("audio/" + name + ".mp3"));
    var done = false; function fin() { if (!done) { done = true; if (then) then(); } }
    a.onerror = function () { haveVoice[name] = false; fin(); };
    a.onended = fin; current = a;
    try { a.currentTime = 0; var p = a.play(); if (p && p.catch) p.catch(function () { fin(); }); } catch (e) { fin(); }
  }
  function sss() { if (haveVoice.sss === false) { hiss(); } else { say("sss", null); setTimeout(function () { if (haveVoice.sss === false) hiss(); }, 250); } }

  var card = document.getElementById("card"), timers = [];
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function steps(k) { [].forEach.call(document.querySelectorAll("#steps span"), function (s, i) { s.className = i < k ? "on" : ""; }); }
  function btn(label, fn, cls) { var b = document.createElement("button"); b.type = "button"; b.className = "ph-btn" + (cls ? " " + cls : ""); b.textContent = label; b.onclick = fn; return b; }
  function confetti() {
    var C = ["#E8456B", "#F39A1E", "#F5C518", "#2E9E4F", "#1E5BB8", "#7B4CC9"];
    for (var i = 0; i < 40; i++) {
      var d = document.createElement("div"); d.className = "ph-confetti";
      d.style.left = Math.random() * 100 + "vw"; d.style.background = C[i % C.length];
      d.style.animationDuration = (1.8 + Math.random() * 1.6) + "s"; d.style.animationDelay = (Math.random() * .5) + "s";
      document.body.appendChild(d); (function (el) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 4200); })(d);
    }
  }
  function go(fn) { clearTimers(); stopVoice(); [].forEach.call(document.querySelectorAll(".ph-confetti"), function (c) { c.parentNode.removeChild(c); }); fn(); }

  // 1. Meet Sunny: listen
  function step1() {
    steps(1);
    card.innerHTML = '<h1>Meet Sunny the Sun</h1><img class="ph-sunny" src="sunny.webp" alt="Sunny the Sun, smiling">' +
      '<p>Sunny wants to shine on things that start with <b>sss</b>. Can you help?</p><div class="ph-big">s</div>';
    var hear = btn("🔊 Hear sss", function () { sss(); next.disabled = false; }, "alt");
    var next = btn("Next", function () { go(step2); }); next.disabled = true;
    var start = btn("▶ Start", function () {
      start.style.display = "none"; hear.style.display = ""; next.style.display = "";
      say("intro", function () { next.disabled = false; });
    });
    hear.style.display = "none"; next.style.display = "none";
    card.appendChild(start); card.appendChild(hear);
    card.appendChild(document.createElement("br")); card.appendChild(next);
  }
  // 2. Action
  function step2() {
    steps(2);
    card.innerHTML = '<h1>Do the action</h1><div class="ph-slide" aria-hidden="true">✋</div>' +
      '<p>Slide your hand from side to side, like a slide, and say <b>sssss</b>.</p>';
    card.appendChild(btn("🔊 sss", sss, "alt"));
    card.appendChild(document.createElement("br"));
    card.appendChild(btn("I did it!", function () { go(step3); }));
    later(function () { say("slide"); }, 300);
  }
  // 3. Shine Sunny: tap the pictures that start with sss
  var PICS = {
    star: ["s", "Yes! Sss, star!"], sock: ["s", "Yes! Sss, sock!"], spoon: ["s", "Yes! Sss, spoon!"], sofa: ["s", "Yes! Sss, sofa!"], snail: ["s", "Yes! Sss, snail!"],
    ball: ["b"], cat: ["c"], dog: ["d"], hat: ["h"], moon: ["m"], cup: ["c"]
  };
  var ROUNDS = [["star", "ball", "sock", "cat"], ["dog", "spoon", "hat", "snail"], ["moon", "sofa", "cup"]];
  var r = 0, fed = 0, missedAny = 0, TOTAL = 5;
  function step3() { steps(3); r = 0; fed = 0; missedAny = 0; round(); }
  function shine() {
    var s = document.getElementById("sunny"); if (!s) return;
    var k = fed / TOTAL; s.style.transform = "scale(" + (1 + 0.45 * k) + ")";
    s.style.filter = "drop-shadow(0 0 " + Math.round(34 * k) + "px rgba(255,193,7," + (0.3 + 0.7 * k) + "))";
  }
  function round() {
    var list = ROUNDS[r], left = list.filter(function (n) { return PICS[n][0] === "s"; }).length;
    card.innerHTML = '<img class="ph-sunny" id="sunny" src="sunny.webp" alt="Sunny the Sun"><h1>Tap the pictures that start with sss</h1>';
    var grid = document.createElement("div"); grid.className = "ph-grid";
    var msg = document.createElement("div"); msg.className = "ph-msg";
    list.forEach(function (name) {
      var b = document.createElement("button"); b.type = "button"; b.className = "ph-choice"; b.setAttribute("aria-label", name);
      b.innerHTML = '<img src="' + name + '.webp" alt="' + name + '">';
      b.onclick = function () {
        if (PICS[name][0] === "s") {
          b.className = "ph-choice right used"; fed++; left--; shine();
          msg.className = "ph-msg good"; msg.textContent = PICS[name][1];
          flyToSunny(b);
          say("y_" + name, function () { if (left === 0) later(nextRound, 1400); });
          if (left === 0) later(nextRound, 3500);
        } else {
          missedAny++; b.className = "ph-choice wrong used"; msg.className = "ph-msg bad";
          msg.textContent = "Oh no! " + name[0].toUpperCase() + name.slice(1) + " starts with " + PICS[name][0] + ". Sunny wants sss.";
          say("n_" + name);
        }
      };
      grid.appendChild(b);
    });
    card.appendChild(grid); card.appendChild(msg);
    shine();
    var done = false;
    function nextRound() { if (done) return; done = true; clearTimers(); r++; r < ROUNDS.length ? round() : go(allFed); }
    if (r === 0) later(function () { say("feed"); }, 300);
  }
  function flyToSunny(b) {
    try {
      var s = document.getElementById("sunny").getBoundingClientRect(), q = b.getBoundingClientRect();
      var im = b.querySelector("img").cloneNode(); im.className = "ph-fly";
      im.style.left = q.left + q.width / 2 - 30 + "px"; im.style.top = q.top + q.height / 2 - 30 + "px"; im.style.width = "60px"; im.style.height = "60px";
      document.body.appendChild(im);
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        im.style.transform = "translate(" + (s.left + s.width / 2 - q.left - q.width / 2) + "px," + (s.top + s.height / 2 - q.top - q.height / 2) + "px) scale(.3)"; im.style.opacity = "0"; }); });
      setTimeout(function () { if (im.parentNode) im.parentNode.removeChild(im); }, 800);
    } catch (e) {}
  }
  function allFed() {
    card.innerHTML = '<img class="ph-sunny" id="sunny" src="sunny.webp" alt="Sunny the Sun shining bright" style="margin:34px 0 64px"><h1>Hooray!</h1><p>Sunny is shining bright! You found all the sss pictures!</p>';
    fed = TOTAL; shine();
    card.appendChild(btn("Next", function () { go(step4); }));
    say("hooray"); confetti();
  }
  // 4. Hear it, find it: which letter says sss?
  function step4() {
    steps(4); var tried = false;
    card.innerHTML = '<h1>Which letter says sss?</h1><p>Press the speaker, then tap the letter.</p>';
    card.appendChild(btn("🔊 Hear it", sss, "alt"));
    var row = document.createElement("div"); row.className = "ph-letters";
    var msg = document.createElement("div"); msg.className = "ph-msg";
    ["t", "s", "m"].forEach(function (L) {
      var b = document.createElement("button"); b.type = "button"; b.className = "ph-letter"; b.textContent = L; b.setAttribute("aria-label", "letter " + L);
      b.onclick = function () {
        if (L === "s") {
          b.className = "ph-letter right"; msg.className = "ph-msg good"; msg.textContent = "Yes! The letter s says sss.";
          [].forEach.call(row.children, function (x) { x.onclick = null; });
          var moved = false; function toTrace() { if (!moved) { moved = true; go(step5); } }
          say("letter_yes", function () { later(toTrace, 700); }); later(toTrace, 6000);
        } else {
          tried = true; b.className = "ph-letter wrong"; msg.className = "ph-msg bad"; msg.textContent = "Not that one. Listen again: sss.";
          say("letter_no");
        }
      };
      row.appendChild(b);
    });
    card.appendChild(row); card.appendChild(msg);
    later(function () { say("which"); }, 300);
  }
  // 5. Trace s
  function step5() {
    steps(5);
    card.innerHTML = '<h1>Write the s</h1><p>Put your finger on the green dot. Go round like a slide.</p>';
    var cv = document.createElement("canvas"); cv.id = "trace"; card.appendChild(cv);
    var msg = document.createElement("div"); msg.className = "ph-msg"; card.appendChild(msg);
    var dpr = window.devicePixelRatio || 1, W = 280, H = 300; cv.width = W * dpr; cv.height = H * dpr;
    var g = cv.getContext("2d"); g.scale(dpr, dpr);
    var svgNS = "http://www.w3.org/2000/svg", path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", "M 196 92 C 172 58 98 56 92 102 C 86 146 192 140 196 196 C 200 246 112 254 82 214");
    var len = path.getTotalLength(), pts = [];
    for (var i = 0; i <= 40; i++) { var p = path.getPointAtLength(len * i / 40); pts.push([p.x, p.y]); }
    var hit = 0, drawing = false;
    function paint() {
      g.clearRect(0, 0, W, H); g.lineCap = "round"; g.lineJoin = "round";
      g.strokeStyle = "#E6DDF6"; g.lineWidth = 38; g.beginPath(); pts.forEach(function (p, i) { i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }); g.stroke();
      g.strokeStyle = "#9C7BD9"; g.lineWidth = 3; g.setLineDash([8, 8]); g.stroke(); g.setLineDash([]);
      g.strokeStyle = "#7B4CC9"; g.lineWidth = 16; g.beginPath(); pts.slice(0, hit + 1).forEach(function (p, i) { i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }); if (hit > 0) g.stroke();
      var s = pts[hit < pts.length - 1 ? hit : pts.length - 1];
      g.fillStyle = "#2E9E4F"; g.beginPath(); g.arc(s[0], s[1], 12, 0, 7); g.fill();
    }
    function pos(e) { var b = cv.getBoundingClientRect(); return [(e.clientX - b.left) * W / b.width, (e.clientY - b.top) * H / b.height]; }
    function move(e) {
      if (!drawing) return; e.preventDefault();
      var q = pos(e);
      while (hit < pts.length - 1) { var n = pts[hit + 1]; if (Math.hypot(n[0] - q[0], n[1] - q[1]) < 30) hit++; else break; }
      paint();
      if (hit >= pts.length - 1) { drawing = false; msg.className = "ph-msg good"; msg.textContent = "Great writing!"; var moved6 = false; function toDone() { if (!moved6) { moved6 = true; go(step6); } }
        say("great", function () { later(toDone, 500); }); later(toDone, 4000); }
    }
    cv.addEventListener("pointerdown", function (e) { var q = pos(e), s = pts[hit]; if (Math.hypot(s[0] - q[0], s[1] - q[1]) < 34) { drawing = true; try { cv.setPointerCapture(e.pointerId); } catch (x) {} } });
    cv.addEventListener("pointermove", move);
    cv.addEventListener("pointerup", function () { drawing = false; });
    paint();
    later(function () { say("trace1", function () { say("trace2"); }); }, 300);
  }
  // 6. Done
  function step6() {
    steps(6);
    var stars = missedAny === 0 ? 3 : missedAny <= 2 ? 2 : 1;
    prog.done.s = Math.max(prog.done.s || 0, stars); save(); drawMap();
    card.innerHTML = '<img class="ph-sunny" src="sunny.webp" alt="Sunny the Sun" style="transform:scale(1.3)"><h1>Well done!</h1><div class="ph-stars">' + "★".repeat(stars) + '</div>' +
      '<p>S says <b>sss</b>, like sun, star and sock.</p><p class="ph-cap">Next lesson: <b>a</b> (coming soon).</p>' +
      '<a class="ph-link" href="../../lkg/english/letter-s/">Print the free Letter S worksheets</a><br>';
    card.appendChild(btn("Play again", function () { go(step1); }, "alt"));
    say("done", function () { say("next"); }); confetti();
  }
  drawMap(); step1();
})();
</script>
