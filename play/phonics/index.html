<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phonics Lesson 1: The s Sound | VidyaPlay</title>
  <meta name="description" content="Free interactive phonics lesson for Nursery and LKG: hear the s sound, do the action, find the s pictures and trace the letter. No sign-up.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../../favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css?v=5">
  <style>
    body { background: #FFFDF7; }
    .ph-wrap { max-width: 560px; margin: 0 auto; padding: 10px 16px 40px; font-family: "Baloo 2", system-ui, sans-serif; color: var(--navy); }
    .ph-map { display: flex; gap: 8px; justify-content: center; margin: 6px 0 14px; flex-wrap: wrap; }
    .ph-tile { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; background: #EEF1F7; color: #9AA3B5; position: relative; }
    .ph-tile.open { background: var(--purple); color: #fff; }
    .ph-tile.done::after { content: "★"; position: absolute; top: -9px; right: -7px; font-size: 18px; color: #FFC107;
      text-shadow: 0 0 2px #B07800; }
    .ph-steps { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
    .ph-steps span { width: 34px; height: 8px; border-radius: 4px; background: #E2E6EF; }
    .ph-steps span.on { background: var(--green); }
    .ph-card { background: #fff; border: 3px solid #E6DDF6; border-radius: 26px; padding: 18px 14px 20px; text-align: center; min-height: 440px; }
    .ph-card h1 { font-size: 26px; margin: 2px 0 6px; line-height: 1.15; }
    .ph-card p { font-size: 19px; margin: 6px 0; color: var(--text); }
    .ph-big { font-size: 120px; font-weight: 800; line-height: 1; color: var(--purple); margin: 4px 0; }
    .ph-pic { width: 190px; height: 160px; object-fit: contain; }
    .ph-btn { display: inline-block; border: 0; border-radius: 18px; padding: 12px 22px; margin: 8px 4px; font: 700 21px "Baloo 2", sans-serif;
      background: var(--green); color: #fff; cursor: pointer; min-height: 54px; }
    .ph-btn.alt { background: var(--blue); }
    .ph-btn[disabled] { opacity: .4; cursor: default; }
    .ph-choices { display: flex; gap: 10px; justify-content: center; margin: 12px 0; }
    .ph-choice { flex: 1; max-width: 150px; aspect-ratio: 1; border: 3px solid #E2E6EF; border-radius: 22px; background: #fff; padding: 8px; cursor: pointer; }
    .ph-choice img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    .ph-choice.right { border-color: var(--green); background: #EAF7EE; }
    .ph-choice.wrong { border-color: var(--pink); animation: shake .35s; }
    @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .ph-msg { min-height: 56px; font-size: 19px; font-weight: 700; margin: 4px 0; }
    .ph-msg.good { color: var(--green); } .ph-msg.bad { color: var(--pink); }
    #trace { width: 280px; height: 300px; touch-action: none; background: #FBF9FF; border-radius: 20px; border: 2px dashed #D9CCF2; }
    .ph-stars { font-size: 56px; color: #FFC107; letter-spacing: 6px; text-shadow: 0 0 3px #B07800; }
    .ph-wiggle { animation: wig 1.2s ease-in-out infinite; }
    @keyframes wig { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
    .ph-note { font-size: 15px; color: #66708A; margin-top: 16px; text-align: left; background: #F4F7FC; border-radius: 14px; padding: 10px 12px; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="topbar-logo" href="../../" aria-label="VidyaPlay home">
      <span class="blue">Vidya</span><span class="pink">P</span><span class="orange">l</span><span class="green">a</span><span class="purple">y</span>
    </a>
  </header>

  <main class="ph-wrap">
    <div class="ph-map" id="map" aria-label="Phonics lessons"></div>
    <div class="ph-steps" id="steps" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    <section class="ph-card" id="card" aria-live="polite"></section>
    <p class="ph-note"><b>For parents:</b> Sit with your child. Say the sound "sss" (a long hiss, not "suh"). Progress is saved only on this device, nothing is sent to us. Print the matching worksheets from the Letter S page.</p>
  </main>

<script>
(function () {
  var LESSONS = ["s", "a", "t", "i", "p", "n"];
  var KEY = "vp_phonics_v1";
  var prog = { done: {} };
  try { var raw = localStorage.getItem(KEY); if (raw) prog = JSON.parse(raw) || prog; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {} }

  function drawMap() {
    var m = document.getElementById("map"); m.innerHTML = "";
    LESSONS.forEach(function (l, i) {
      var t = document.createElement("div");
      t.className = "ph-tile" + (i === 0 ? " open" : "") + (prog.done[l] ? " done" : "");
      t.textContent = l; t.title = i === 0 ? "Lesson 1" : "Coming soon";
      m.appendChild(t);
    });
  }

  // ---- sound ----
  var ctx = null;
  function hiss() {                              // a pure "sss": filtered noise, no vowel after it
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      var d = 0.9, n = Math.floor(ctx.sampleRate * d), buf = ctx.createBuffer(1, n, ctx.sampleRate), ch = buf.getChannelData(0);
      for (var i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
      var src = ctx.createBufferSource(); src.buffer = buf;
      var hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 3800;
      var bp = ctx.createBiquadFilter(); bp.type = "peaking"; bp.frequency.value = 6500; bp.Q.value = 1.2; bp.gain.value = 8;
      var g = ctx.createGain(), t0 = ctx.currentTime;
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.35, t0 + 0.08);
      g.gain.setValueAtTime(0.35, t0 + d - 0.15); g.gain.linearRampToValueAtTime(0, t0 + d);
      src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(ctx.destination); src.start();
    } catch (e) {}
  }
  var cache = {};
  function clip(name, then) {
    var a = cache[name] || (cache[name] = new Audio("audio/" + name + ".mp3"));
    try { a.currentTime = 0; a.onended = then || null; var p = a.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }

  var card = document.getElementById("card");
  function steps(k) { [].forEach.call(document.querySelectorAll("#steps span"), function (s, i) { s.className = i < k ? "on" : ""; }); }
  function btn(label, fn, cls) { var b = document.createElement("button"); b.type = "button"; b.className = "ph-btn" + (cls ? " " + cls : ""); b.textContent = label; b.onclick = fn; return b; }

  // ---- step 1: listen ----
  function step1() {
    steps(1);
    card.innerHTML = '<h1>Listen: the s sound</h1><div class="ph-big">s</div>' +
      '<img class="ph-pic" src="snake.webp" alt="A snake"><p>The snake says <b>sss</b>.</p>';
    var next = btn("Next", step2); next.disabled = true;
    card.appendChild(btn("🔊 Hear sss", function () { hiss(); next.disabled = false; }, "alt"));
    card.appendChild(document.createElement("br")); card.appendChild(next);
  }
  // ---- step 2: action ----
  function step2() {
    steps(2);
    card.innerHTML = '<h1>Do the action</h1><img class="ph-pic ph-wiggle" src="snake.webp" alt="A snake">' +
      '<p>Move your hand like a snake, side to side, and say <b>sssss</b>.</p>';
    card.appendChild(btn("🔊 sss", hiss, "alt"));
    card.appendChild(document.createElement("br"));
    card.appendChild(btn("I did it!", step3));
  }
  // ---- step 3: tap the s picture ----
  var ROUNDS = [
    { ok: "sun", other: [["ball", "b"], ["cat", "c"]], order: [1, 0, 2] },
    { ok: "star", other: [["dog", "d"], ["hat", "h"]], order: [0, 2, 1] },
    { ok: "sun", other: [["moon", "m"], ["cup", "c"]], order: [2, 1, 0] }
  ];
  var r = 0, firstTry = 0;
  function step3() { steps(3); r = 0; firstTry = 0; round(); }
  function round() {
    var R = ROUNDS[r], items = [[R.ok, "s"]].concat(R.other), shown = R.order.map(function (i) { return items[i]; });
    card.innerHTML = '<h1>Which one starts with sss?</h1><p>Picture ' + (r + 1) + ' of 3. Tap a picture.</p>';
    card.appendChild(btn("🔊 sss", hiss, "alt"));
    var row = document.createElement("div"); row.className = "ph-choices";
    var msg = document.createElement("div"); msg.className = "ph-msg";
    var missed = false;
    shown.forEach(function (it) {
      var b = document.createElement("button"); b.type = "button"; b.className = "ph-choice";
      b.innerHTML = '<img src="' + it[0] + '.webp" alt="' + it[0] + '">'; b.setAttribute("aria-label", it[0]);
      b.onclick = function () {
        if (it[0] === R.ok) {
          b.className = "ph-choice right"; msg.className = "ph-msg good";
          msg.textContent = "Yes! " + it[0] + " starts with sss.";
          if (!missed) firstTry++;
          [].forEach.call(row.children, function (x) { x.onclick = null; });
          clip(it[0], function () { clip("yes"); });
          setTimeout(function () { r++; r < ROUNDS.length ? round() : step4(); }, 2200);
        } else {
          missed = true; b.className = "ph-choice wrong"; msg.className = "ph-msg bad";
          msg.textContent = it[0] + " starts with " + it[1] + ", not sss. Try again!";
          clip(it[0]);
        }
      };
      row.appendChild(b);
    });
    card.appendChild(row); card.appendChild(msg);
    setTimeout(hiss, 400);
  }
  // ---- step 4: trace s ----
  function step4() {
    steps(4);
    card.innerHTML = '<h1>Trace the s</h1><p>Start at the green dot. Go round like the snake.</p>';
    var cv = document.createElement("canvas"); cv.id = "trace"; card.appendChild(cv);
    var msg = document.createElement("div"); msg.className = "ph-msg"; card.appendChild(msg);
    var dpr = window.devicePixelRatio || 1, W = 280, H = 300; cv.width = W * dpr; cv.height = H * dpr;
    var g = cv.getContext("2d"); g.scale(dpr, dpr);
    var svgNS = "http://www.w3.org/2000/svg", path = document.createElementNS(svgNS, "path");
    // small s: top right, round to the left, across the middle, round to the right, end bottom left
    path.setAttribute("d", "M 196 92 C 172 58 98 56 92 102 C 86 146 192 140 196 196 C 200 246 112 254 82 214");
    var len = path.getTotalLength(), pts = [];
    for (var i = 0; i <= 40; i++) { var p = path.getPointAtLength(len * i / 40); pts.push([p.x, p.y]); }
    var hit = 0, ink = [], drawing = false;
    function paint() {
      g.clearRect(0, 0, W, H);
      g.lineCap = "round"; g.lineJoin = "round";
      g.strokeStyle = "#E6DDF6"; g.lineWidth = 38; g.beginPath(); pts.forEach(function (p, i) { i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }); g.stroke();
      g.strokeStyle = "#9C7BD9"; g.lineWidth = 3; g.setLineDash([8, 8]); g.stroke(); g.setLineDash([]);
      g.strokeStyle = "#7B4CC9"; g.lineWidth = 16; g.beginPath(); pts.slice(0, hit + 1).forEach(function (p, i) { i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }); if (hit) g.stroke();
      var s = pts[hit < pts.length - 1 ? hit : pts.length - 1];
      g.fillStyle = "#2E9E4F"; g.beginPath(); g.arc(s[0], s[1], 12, 0, 7); g.fill();
    }
    function pos(e) { var b = cv.getBoundingClientRect(); return [(e.clientX - b.left) * W / b.width, (e.clientY - b.top) * H / b.height]; }
    function move(e) {
      if (!drawing) return; e.preventDefault();
      var q = pos(e);
      while (hit < pts.length - 1) {
        var n = pts[hit + 1]; if (Math.hypot(n[0] - q[0], n[1] - q[1]) < 30) hit++; else break;
      }
      paint();
      if (hit >= pts.length - 1) { drawing = false; msg.className = "ph-msg good"; msg.textContent = "Super! You wrote s."; hiss(); setTimeout(step5, 1600); }
    }
    cv.addEventListener("pointerdown", function (e) { var q = pos(e), s = pts[hit]; if (Math.hypot(s[0] - q[0], s[1] - q[1]) < 34) { drawing = true; cv.setPointerCapture(e.pointerId); } else { msg.className = "ph-msg bad"; msg.textContent = "Put your finger on the green dot."; } });
    cv.addEventListener("pointermove", move);
    cv.addEventListener("pointerup", function () { drawing = false; });
    paint();
  }
  // ---- step 5: done ----
  function step5() {
    steps(5);
    var stars = firstTry >= 3 ? 3 : firstTry >= 1 ? 2 : 1;
    prog.done.s = Math.max(prog.done.s || 0, stars); save(); drawMap();
    card.innerHTML = '<h1>Well done!</h1><div class="ph-stars">' + "★".repeat(stars) + '</div>' +
      '<p>You learned the <b>s</b> sound.</p><p>Next lesson: <b>a</b> (coming soon).</p>';
    clip("win");
    card.appendChild(btn("Play again", step1, "alt"));
  }

  drawMap(); step1();
})();
</script>
</body>
</html>
